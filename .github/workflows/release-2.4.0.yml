name: "Release iloader 2.4.0"

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/release-2.4.0.yml"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Disable updater artifacts for release build
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

      - name: Build Windows installers
        run: npm run tauri build

      - name: Publish Tagv4 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Tagv4
          name: Tagv4
          target_commitish: ${{ github.sha }}
          body: |
            iloader 2.4.0

            Highlights:
            - Signing Center asset health for certificates, App IDs and devices.
            - Account/team-scoped preflight caches with explicit invalidation after signing.
            - Validated Signing Bundle import staging with hardened ZIP/checksum/profile validation.
            - signing-report.json with per-stage timing, SHA-256 and sanitized diagnostics.
            - Bounded signing pipeline: Apple signing remains serial while local post-processing runs with bounded concurrency.
            - Improved retry/failure isolation and regression coverage.

            Validation:
            - P1 PR Build #107 passed.
            - Merge-to-main Build #108 passed.
          files: |
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.exe
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.msi
          fail_on_unmatched_files: true
