name: "Release iloader 2.4.2"

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/release-2.4.1.yml"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Disable updater artifacts for release build
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

      - name: Build Windows installers
        run: npm run tauri build

      - name: Publish Tagv6 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Tagv6
          name: Tagv6
          target_commitish: ${{ github.sha }}
          body: |
            iloader 2.4.2

            Hotfix:
            - Fix Signing Center asset-health false failures caused by transient Sideloader contention.
            - Retry temporary NotLoggedIn contention instead of surfacing it as an account logout.
            - Localize the Signing Center Simplified Chinese UI, including buttons, status labels, queue summaries and signing results.
            - Replace opaque `[object Object]` frontend errors with readable Chinese session/error messages.
            - Keep the 2.4.0/2.4.1 signing security boundaries unchanged.

            Validation:
            - Hotfix PR Build #116 passed.
            - Merge-to-main Build #117 passed.
          files: |
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.exe
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.msi
          fail_on_unmatched_files: true
