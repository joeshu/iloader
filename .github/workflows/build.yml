name: "Build iloader"

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache Rust, Bun and frontend dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            node_modules
            ~/.bun/install/cache
          key: windows-iloader-${{ hashFiles('**/Cargo.lock', 'package-lock.json', 'bun.lock') }}
          restore-keys: |
            Windows-iloader-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Add MSVC to PATH
        shell: pwsh
        run: |
          Write-Host "MSVC environment provided by windows-latest"

      - name: Install frontend dependencies
        run: npm install

      - name: Disable updater artifacts for CI validation
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath -Encoding utf8

      - name: Build
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: iloader-windows
          path: |
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.exe
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

      - name: Publish Windows installers to Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.exe
            ${{ github.workspace }}/src-tauri/target/release/bundle/**/*.msi
          fail_on_unmatched_files: true
